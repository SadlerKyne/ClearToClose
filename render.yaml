databases:
  - name: clear-to-close-db
    plan: free

services:
  - type: web
    name: clear-to-close
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clear-to-close-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
